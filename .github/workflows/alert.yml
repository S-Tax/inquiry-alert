name: 신청알림

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inquiry-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: 신규 신청 확인
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          TZ: Asia/Seoul
        run: python inquiry_alert.py

      - name: 상태 저장
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          if git diff --quiet state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi
          cp state.json /tmp/state.mine.json
          git checkout -- state.json
          git pull --quiet
          # 원격 state 와 내 state 중 last_id 가 큰 쪽을 남긴다 (절대 작은 값으로 덮어쓰지 않음)
          python - <<'EOF'
          import json
          mine = json.load(open('/tmp/state.mine.json'))
          try:
              remote = json.load(open('state.json'))
          except Exception:
              remote = {}
          merged = dict(remote)
          merged.update(mine)
          merged['last_id'] = max(int(mine.get('last_id') or 0), int(remote.get('last_id') or 0))
          json.dump(merged, open('state.json', 'w'), ensure_ascii=False, indent=2)
          print('저장:', merged)
          EOF
          git add state.json
          git diff --cached --quiet || git commit -m "state update"
          git push
